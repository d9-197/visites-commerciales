# Back + application web + PostgreSQL. Usage : cp .env.example .env, renseigner les valeurs, puis : docker compose up --build
# Non testé dans l'environnement de développement (pas de démon Docker).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis}
      POSTGRES_DB: visites
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d visites"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@db:5432/visites
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis (32 caractères minimum)}
      SEED_DEMO: ${SEED_DEMO:-0}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      # Synthèse par IA (facultatif) : sans clé, la fonction est désactivée.
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-}
      MISTRAL_TRANSCRIBE_MODEL: ${MISTRAL_TRANSCRIBE_MODEL:-}
      MISTRAL_PRICE_TRANSCRIBE_EUR_PER_MIN: ${MISTRAL_PRICE_TRANSCRIBE_EUR_PER_MIN:-}
      MISTRAL_PRICE_IN_EUR_PER_M: ${MISTRAL_PRICE_IN_EUR_PER_M:-}
      MISTRAL_PRICE_OUT_EUR_PER_M: ${MISTRAL_PRICE_OUT_EUR_PER_M:-}
      # Envoi d'e-mail des visites (facultatif) : sans SMTP_HOST et SMTP_FROM, la fonction est désactivée.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EMAIL_RATE_PER_HOUR: ${EMAIL_RATE_PER_HOUR:-}
      # Marque blanche : nom et logo de l'entreprise (facultatif). Logo : fichier du dossier ./brand (png, jpg, webp ou svg, 512 Ko au plus).
      BRAND_NAME: ${BRAND_NAME:-}
      BRAND_LOGO_FILE: ${BRAND_LOGO_FILE:-}
      PORT: "3000"
      # Application servie sous un sous-chemin du domaine (https://exemple.fr/visit) : BASE_PATH=/visit. Vide : à la racine.
      BASE_PATH: ${BASE_PATH:-}
    volumes: ["./brand:/brand:ro"]
    ports: ["${APP_PORT:-3000}:3000"]
volumes:
  pgdata:
